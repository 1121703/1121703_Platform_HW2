name: HW2_Auto_Fetch_Weather_Data

on:
  schedule:
    # 設定每天凌晨 0 點執行一次 (UTC 時間，約台灣時間早上 8 點)
    - cron: '0 0 * * *'
  # 允許在 GitHub 網頁介面手動點擊執行 (作業要求)
  workflow_dispatch:

jobs:
  build_and_run:
    runs-on: ubuntu-latest

    steps:
      # 1. 下載並檢查儲存庫內容
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安裝 Python 環境 (HW2 要求使用 Python)
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安裝所需的套件 (requests)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. 執行您的 Python 程式碼
      - name: Run api.py
        run: python api.py

      # 5. 將產生的 data.json 與 data.csv 存回 GitHub
      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json data.csv
          # 如果資料沒有變動，避免程式報錯
          git commit -m "Auto update tide data" || exit 0
          git push
